name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  NETSENTINEL_LLM: none

jobs:
  checks:
    name: Lint, C++, tests, training (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      NETSENTINEL_REQUIRE_CPP: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: ci/run_checks.sh setup
      - run: ci/run_checks.sh lint
      - run: ci/run_checks.sh cpp
      - run: ci/run_checks.sh test
      - run: ci/run_checks.sh train
      - name: Upload test results and metrics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports-py${{ matrix.python-version }}
          path: reports/ci/

  python-only:
    name: Works without the C++ module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: ci/run_checks.sh setup
      - run: ci/run_checks.sh test

  agent-image:
    name: Jenkins agent image runs the full pipeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t netsentinel-ci -f ci/Dockerfile .
      - name: Run all checks inside the image, as Jenkins would
        run: |
          docker run --rm -v "$PWD":/work -w /work -e NETSENTINEL_REQUIRE_CPP=1 netsentinel-ci \
            bash -c "python -m venv /tmp/venv && . /tmp/venv/bin/activate && ci/run_checks.sh setup && ci/run_checks.sh all"
